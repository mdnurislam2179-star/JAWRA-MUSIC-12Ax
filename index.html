<!DOCTYPE html>
<html lang="bn"><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JAWRA MUSIC</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:pan-x pan-y;
    overscroll-behavior-x:none;
}

body{
    margin:0;
    width:100%;
    min-height:100vh;
    background:#fff;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    touch-action:pan-x pan-y;
    overscroll-behavior-x:none;
    user-select:none;
    -webkit-user-select:none;
}

button,
input{
    font-family:inherit;
}

/* =====================================================
   SPLASH
===================================================== */

#splashScreen{
    position:fixed;
    inset:0;
    z-index:9999999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    animation:splashAutoHide .7s ease 2.2s forwards;
}

#splashScreen img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    animation:logoPulse 1.25s ease-in-out infinite;
    box-shadow:
        0 0 25px rgba(155,0,255,.8),
        0 0 70px rgba(100,0,255,.45);
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes splashAutoHide{
    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    min-height:100vh;
    padding-bottom:82px;
}

/* =====================================================
   HOME HEADER
===================================================== */

.home-header{
    width:100%;
    padding:12px 14px 8px;
    background:rgba(255,255,255,.98);
    position:sticky;
    top:0;
    z-index:3000;
    border-bottom:1px solid #ededed;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.brand{
    text-align:center;
    font-size:24px;
    font-weight:900;
    letter-spacing:.5px;
    margin-bottom:11px;
}

.brand span{
    color:#7a00ff;
}

/* =====================================================
   HOME SEARCH
===================================================== */

.home-search-wrap{
    width:100%;
    display:flex;
    justify-content:center;
}

.home-search{
    width:calc(100% - 24px);
    max-width:680px;
    height:46px;
    display:flex;
    align-items:center;
    border:1px solid #ddd;
    background:#f7f7f7;
    border-radius:25px;
    padding-left:16px;
    padding-right:5px;
}

.home-search input{
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    background:transparent;
    font-size:15px;
    color:#111;
    user-select:text;
    -webkit-user-select:text;
}

.home-search button{
    width:37px;
    height:37px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:17px;
}

/* =====================================================
   CATEGORIES
===================================================== */

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:10px 14px 9px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    padding:8px 15px;
    border:0;
    border-radius:20px;
    background:#f0f0f0;
    color:#111;
    font-size:13px;
    font-weight:700;
}

.category.active{
    background:#111;
    color:#fff;
}

/* =====================================================
   HOME VIDEO LIST
===================================================== */

#results{
    width:100%;
    padding:5px 12px 25px;
}

.video-card{
    width:100%;
    margin-bottom:18px;
    cursor:pointer;
}

.video-thumb{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:13px;
    background:#e9e9e9;
}

.video-thumb img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.video-title{
    margin-top:9px;
    font-size:15px;
    font-weight:700;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.video-channel{
    margin-top:5px;
    color:#777;
    font-size:12px;
}

/* =====================================================
   LOAD MORE
===================================================== */

#loadMore{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:13px;
}

/* =====================================================
   PLAYER PAGE
===================================================== */

#playerPage{
    display:none;
    min-height:100vh;
    background:#fff;
    padding-bottom:25px;
}

/* =====================================================
   PLAYER HEADER
===================================================== */

.player-header{
    position:sticky;
    top:0;
    z-index:5000;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    color:#fff;
    background:#000;
}

.player-left{
    display:flex;
    align-items:center;
    min-width:0;
}

.player-back{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:31px;
}

.player-name{
    font-size:15px;
    font-weight:900;
    margin-left:2px;
}

.player-actions{
    display:flex;
    align-items:center;
    gap:4px;
}

.player-search-btn,
.player-demon-btn,
.player-rotate-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:19px;
}

.player-demon-btn{
    font-size:21px;
}

/* GOLD ROTATE ICON */

.player-rotate-btn{
    color:#d6a84f;
    font-size:23px;
    font-weight:900;
    text-shadow:
        0 0 6px rgba(214,168,79,.35);
}

/* =====================================================
   PLAYER SEARCH
===================================================== */

#playerSearchPanel{
    position:absolute;
    top:55px;
    right:10px;
    z-index:7000;
    width:min(390px,calc(100vw - 20px));
    display:none;
    padding:6px;
    background:rgba(255,255,255,.98);
    border:1px solid #ddd;
    border-radius:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
}

.player-search-inner{
    height:40px;
    display:flex;
    align-items:center;
}

#playerSearchInput{
    flex:1;
    min-width:0;
    height:100%;
    border:0;
    outline:none;
    background:transparent;
    padding:0 12px;
    font-size:14px;
    color:#111;
    user-select:text;
    -webkit-user-select:text;
}

#playerSearchSubmit{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
}

/* =====================================================
   PREMIUM VIDEO PLAYER
   GOLD BORDER
   NO ROUNDED CORNERS
===================================================== */

#fullFrameHost{
    width:100%;
    background:#000;

    position:sticky;
    top:52px;
    z-index:4500;

    /*
       চার দিক জুড়ে Gold border
       Corner একদম square
    */

    border:3px solid #d6a84f;
    border-radius:0;
    overflow:hidden;

    box-shadow:
        0 0 0 1px rgba(214,168,79,.25),
        0 6px 25px rgba(0,0,0,.35);
}

#youtubeFrame{
    width:100%;
    aspect-ratio:16/9;
    height:auto;
    display:block;
    border:0;
    background:#000;
}

/* =====================================================
   FULLSCREEN PLAYER
===================================================== */

#fullFrameHost:fullscreen{
    width:100vw;
    height:100vh;

    position:fixed;
    inset:0;

    z-index:999999;

    border:0;
    border-radius:0;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:none;
}

#fullFrameHost:-webkit-full-screen{
    width:100vw;
    height:100vh;

    position:fixed;
    inset:0;

    z-index:999999;

    border:0;
    border-radius:0;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:none;
}

#fullFrameHost:fullscreen #youtubeFrame,
#fullFrameHost:-webkit-full-screen #youtubeFrame{
    width:100vw;
    height:100vh;
    aspect-ratio:auto;
    object-fit:contain;
}

/* =====================================================
   MORE VIDEOS BUTTON
===================================================== */

#moreVideosButton{
    position:absolute;

    right:18px;
    bottom:18px;

    z-index:1000002;

    display:none;

    align-items:center;
    gap:9px;

    min-height:48px;

    padding:7px 9px 7px 17px;

    border:1px solid rgba(255,255,255,.22);

    border-radius:28px;

    background:rgba(15,15,15,.78);

    color:#fff;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);
}

#moreVideosButton span{
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:700;
    font-style:italic;
    white-space:nowrap;
}

#moreVideosButton img{
    width:104px;
    height:58px;

    object-fit:cover;

    border-radius:19px;

    border:2px solid #fff;

    display:block;
}

/* =====================================================
   MORE VIDEOS OVERLAY
===================================================== */

#moreVideosOverlay{
    position:fixed;
    inset:0;

    z-index:1000005;

    display:none;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);

    overflow-y:auto;
}

.more-overlay-inner{
    width:100%;
    min-height:100%;

    padding:
        25px
        5.2vw
        45px;

    background:
        linear-gradient(
            rgba(0,0,0,.50),
            rgba(0,0,0,.72)
        );

    position:relative;
}

.more-overlay-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:22px;
}

.more-overlay-title{
    color:#fff;

    font-family:Georgia,serif;

    font-size:28px;

    font-weight:700;

    font-style:italic;
}

#closeMoreVideos{
    width:48px;
    height:48px;

    border:0;

    background:transparent;

    color:#fff;

    font-size:39px;

    line-height:1;

    cursor:pointer;
}

.more-tabs{
    display:flex;
    align-items:center;

    gap:16px;

    overflow-x:auto;

    scrollbar-width:none;

    margin-bottom:28px;
}

.more-tabs::-webkit-scrollbar{
    display:none;
}

.more-tab{
    flex:0 0 auto;

    border:0;

    padding:12px 23px;

    border-radius:16px;

    background:rgba(255,255,255,.09);

    color:#fff;

    font-family:Georgia,serif;

    font-size:17px;

    font-weight:700;

    font-style:italic;
}

.more-tab.active{
    background:#fff;
    color:#111;
}

#moreVideosResults{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(290px,1fr)
        );

    gap:26px;
}

.more-video-card{
    position:relative;

    min-width:0;

    cursor:pointer;

    color:#fff;
}

.more-video-thumb{
    width:100%;

    aspect-ratio:16/9;

    overflow:hidden;

    border-radius:0;

    background:#111;

    border:1px solid rgba(255,255,255,.13);
}

.more-video-thumb img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.more-video-info{
    display:flex;
    gap:13px;

    padding-top:12px;
}

.more-video-avatar{
    width:48px;
    height:48px;

    min-width:48px;

    border-radius:50%;

    object-fit:cover;

    background:#222;
}

.more-video-text{
    min-width:0;
}

.more-video-title{
    font-family:Georgia,serif;

    font-size:17px;

    line-height:1.35;

    font-weight:700;

    font-style:italic;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.more-video-channel{
    margin-top:5px;

    color:#bdbdbd;

    font-family:Georgia,serif;

    font-size:13px;

    font-style:italic;
}

.more-video-menu{
    margin-left:auto;

    color:#fff;

    font-size:25px;
}

.more-loading{
    width:100%;

    grid-column:1/-1;

    padding:55px 15px;

    text-align:center;

    color:#ddd;

    font-family:Georgia,serif;

    font-size:16px;
}

/* =====================================================
   RELATED
===================================================== */

.related{
    padding:9px 12px 30px;
}

.related-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:8px 0 12px;
}

#relatedTitle{
    font-size:19px;
    font-weight:900;
}

.related-clear{
    display:none;
    border:0;
    background:#f2f2f2;
    padding:7px 11px;
    border-radius:15px;
    font-size:11px;
}

/* =====================================================
   MINI PLAYER
===================================================== */

#miniPlayer{
    position:fixed;
    left:10px;
    right:10px;
    bottom:76px;
    z-index:8500;
    display:none;
    align-items:center;
    padding:6px;
    background:#111;
    border-radius:13px;
    box-shadow:0 7px 30px rgba(0,0,0,.35);
}

#miniVideoHost{
    width:90px;
    min-width:90px;
    height:51px;
    overflow:hidden;
    border-radius:8px;
    background:#000;
}

#youtubeFrame.mini-frame{
    width:90px;
    height:51px;
    aspect-ratio:auto;
    display:block;
    border:0;
}

.mini-info{
    min-width:0;
    flex:1;
    padding:0 8px;
    cursor:pointer;
}

#miniTitle{
    color:#fff;
    font-size:12px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#miniClose{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:21px;
}

/* =====================================================
   HOME DEMON
===================================================== */

#homeDemon{
    position:fixed;
    right:15px;
    bottom:145px;
    z-index:8300;
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:23px;
    display:none;
    box-shadow:0 6px 22px rgba(0,0,0,.28);
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9000;
    height:66px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #e6e6e6;
    display:flex;
    align-items:center;
    justify-content:space-around;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
}

.nav-btn{
    border:0;
    background:transparent;
    color:#555;
    font-size:11px;
    font-weight:700;
}

.nav-btn div{
    font-size:22px;
    line-height:23px;
}

.add-btn{
    width:49px;
    height:38px;
    border:0;
    border-radius:13px;
    background:#111;
    color:#fff;
    font-size:27px;
}

/* =====================================================
   BACKGROUND MENU
===================================================== */

#backgroundMenu{
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:flex-end;
}

.background-panel{
    width:100%;
    padding:20px;
    background:#fff;
    border-radius:22px 22px 0 0;
}

.background-panel h3{
    margin:0 0 14px;
    font-size:18px;
}

.bg-option{
    width:100%;
    margin:5px 0;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#f3f3f3;
    text-align:left;
    font-size:14px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
    padding:35px 12px;
    text-align:center;
    color:#777;
    font-size:14px;
}

/* =====================================================
   DARK
===================================================== */

body.dark{
    background:#0b0b0b;
    color:#fff;
}

body.dark .home-header,
body.dark .bottom-nav{
    background:rgba(12,12,12,.98);
    border-color:#242424;
}

body.dark .home-search{
    background:#181818;
    border-color:#333;
}

body.dark .home-search input{
    color:#fff;
}

body.dark .category{
    background:#222;
    color:#ddd;
}

body.dark .category.active{
    background:#fff;
    color:#000;
}

body.dark .video-channel{
    color:#888;
}

body.dark #playerPage{
    background:#0b0b0b;
}

body.dark .background-panel{
    background:#151515;
}

body.dark .bg-option{
    background:#252525;
    color:#fff;
}

body.dark #playerSearchPanel{
    background:#171717;
    border-color:#333;
}

body.dark #playerSearchInput{
    color:#fff;
}

body.dark .related-clear{
    background:#222;
    color:#fff;
}

/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:600px){

    .more-overlay-inner{
        padding:
            18px
            12px
            35px;
    }

    .more-overlay-title{
        font-size:23px;
    }

    #moreVideosResults{
        grid-template-columns:1fr;
        gap:22px;
    }

    .more-video-title{
        font-size:15px;
    }

    #moreVideosButton{
        right:10px;
        bottom:12px;
    }

    #moreVideosButton img{
        width:82px;
        height:46px;
        border-radius:15px;
    }

    #moreVideosButton span{
        font-size:15px;
    }

    .brand{
        font-size:22px;
    }

    #results,
    .related{
        padding-left:9px;
        padding-right:9px;
    }

    .video-title{
        font-size:14px;
    }

    .video-thumb{
        border-radius:11px;
    }

}

/* =====================================================
   LANDSCAPE
===================================================== */

@media(orientation:landscape){

    #fullFrameHost:fullscreen #youtubeFrame,
    #fullFrameHost:-webkit-full-screen #youtubeFrame{
        width:100vw;
        height:100vh;
        object-fit:contain;
    }

}
</style>
</head>

<body>

<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splashScreen">

    <img
        src="https://i.ibb.co.com/r2cGS8H4/1000012185.jpg"
        alt="JAWRA MUSIC"
        onerror="this.style.display='none'">

</div>


<!-- =====================================================
     HOME
===================================================== -->

<div id="app">

    <header class="home-header">

        <div class="brand">
            JAWRA <span>MUSIC</span>
        </div>

        <div class="home-search-wrap">

            <div class="home-search">

                <input
                    id="searchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="Search music...">

                <button id="searchBtn">
                    🔍
                </button>

            </div>

        </div>

        <div class="categories">

            <button
                class="category active"
                data-query="trending music">
                Trending
            </button>

            <button
                class="category"
                data-query="Bangla songs">
                Bangla
            </button>

            <button
                class="category"
                data-query="Hindi songs">
                Hindi
            </button>

            <button
                class="category"
                data-query="English songs">
                English
            </button>

            <button
                class="category"
                data-query="Lofi music">
                Lofi
            </button>

            <button
                class="category"
                data-query="Remix songs">
                Remix
            </button>

        </div>

    </header>


    <main id="results">

        <div class="status">
            Loading JAWRA MUSIC...
        </div>

    </main>


    <div id="loadMore">
        Scroll for more
    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<section id="playerPage">

    <header class="player-header">

        <div class="player-left">

            <button
                class="player-back"
                id="playerBack">
                ‹
            </button>

            <div class="player-name">
                JAWRA MUSIC
            </div>

        </div>


        <div class="player-actions">

            <button
                class="player-search-btn"
                id="playerSearchBtn">
                🔍
            </button>

            <!-- GOLD ROTATE BUTTON -->

            <button
                class="player-rotate-btn"
                id="playerRotateBtn"
                aria-label="Rotate">
                ⛶
            </button>

            <button
                class="player-demon-btn"
                id="playerDemonBtn">
                😈
            </button>

        </div>


        <div id="playerSearchPanel">

            <div class="player-search-inner">

                <input
                    id="playerSearchInput"
                    type="search"
                    autocomplete="off"
                    placeholder="Search while playing...">

                <button id="playerSearchSubmit">
                    🔍
                </button>

            </div>

        </div>

    </header>


    <!-- STICKY VIDEO -->

    <div id="fullFrameHost">

        <!-- More videos button fullscreen-এ দেখা যাবে -->

        <button id="moreVideosButton">

            <span>
                More videos
            </span>

/* =====================================================

function hideSplash(){

    if(!el) return;

    el.style.opacity = "0";
    el.style.visibility = "hidden";

/* =====================================================
   STATE
===================================================== */

let nextPageToken = "";
let currentQuery = "trending music";
let loading = false;

let currentVideoId = "";
let currentVideoTitle = "";
let currentVideoThumb = "";

let isMiniMode = false;

/* =====================================================
   API CHECK
===================================================== */

function hasApiKey(){

    return (
        API_KEY &&
        API_KEY.trim() !== "" &&
        !API_KEY.includes(
            "YOUR_YOUTUBE_API_KEY"
        )
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   TITLE CLEAN
===================================================== */

function normalizeSongTitle(title){

    return String(title || "")
        .replace(
            /\b(official|video|audio|lyrics?|lyric|4k|hd|full|status|shorts?|song|songs|music)\b/gi,
            " "
        )
        .replace(
            /[^\u0980-\u09FFa-zA-Z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =====================================================
   RANDOM
===================================================== */

function randomItem(array){

    if(!array.length){
        return "";
    }

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const copy =
        [...array];

    for(
        let i=copy.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i+1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =====================================================
   YOUTUBE REQUEST
===================================================== */

async function youtubeRequest(params){

    const query = {

        key:API_KEY,

        part:"snippet",

        maxResults:
            params.maxResults || "20",

        type:"video",

        videoEmbeddable:"true",

        regionCode:"BD",

        relevanceLanguage:"bn",

        ...params

    };


    const url =
        API_URL +
        "?" +
        new URLSearchParams(query)
            .toString();


    const response =
        await fetch(url);


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data?.error?.message ||
            "YouTube API error"
        );

    }


    return data;

}


/* =====================================================
   ERROR
===================================================== */

function showApiError(message){

    results.innerHTML = `
        <div class="status">
            ❌ ${escapeHtml(message)}
        </div>
    `;

}


/* =====================================================
   CARD
===================================================== */

function makeCard(item){

    const videoId =
        item?.id?.videoId;

    if(!videoId){
        return null;
    }


    const title =
        item?.snippet?.title ||
        "Unknown video";


    const channel =
        item?.snippet?.channelTitle ||
        "";


    const thumb =
        item?.snippet?.thumbnails?.high?.url ||
        item?.snippet?.thumbnails?.medium?.url ||
        item?.snippet?.thumbnails?.default?.url ||
        "";


    const card =
        document.createElement("article");

    card.className =
        "video-card";


    card.innerHTML = `

        <div class="video-thumb">

            <img
                src="${escapeHtml(thumb)}"
                loading="lazy"
                alt="">

        </div>

        <div class="video-title">
            ${escapeHtml(
                normalizeSongTitle(title) ||
                title
            )}
        </div>

        <div class="video-channel">
            ${escapeHtml(channel)}
        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            openPlayer(
                videoId,
                title,
                thumb
            );

        }
    );


    return card;

}


/* =====================================================
   RENDER
===================================================== */

function renderVideos(
    items,
    container,
    append=false
){

    if(!append){
        container.innerHTML = "";
    }


    let count = 0;


    for(const item of items){

        const card =
            makeCard(item);


        if(card){

            container.appendChild(card);

            count++;

        }

    }


    if(!append && count === 0){

        container.innerHTML = `
            <div class="status">
                কোনো ভিডিও পাওয়া যায়নি।
            </div>
        `;

    }

}


/* =====================================================
   HOME LOAD
===================================================== */

async function loadHomeVideos(){

    if(loading){
        return;
    }


    if(!hasApiKey()){

        showApiError(
            "YouTube API Key বসানো হয়নি। API_KEY-এর জায়গায় তোমার API key বসাও।"
        );

        return;

    }


    loading = true;


    if(!nextPageToken){

        results.innerHTML = `
            <div class="status">
                Loading music...
            </div>
        `;

    }


    try{

        const data =
            await youtubeRequest({

                q:currentQuery,

                pageToken:
                    nextPageToken || ""

            });


        renderVideos(
            data.items || [],
            results,
            Boolean(nextPageToken)
        );


        nextPageToken =
            data.nextPageToken || "";


    }
    catch(error){

        console.error(error);

        showApiError(
            error.message ||
            "ভিডিও লোড করা যায়নি।"
        );

    }


    loading = false;

}


/* =====================================================
   HOME SEARCH
===================================================== */

async function doHomeSearch(){

    const q =
        searchInput.value.trim();


    if(!q){
        return;
    }


    currentQuery = q;

    nextPageToken = "";


    await loadHomeVideos();

function openPlayer(

/* =====================================================
   RELATED VIDEOS
===================================================== */

async function loadRelatedVideos(query){

    if(!hasApiKey()){
        return;
    }


    relatedResults.innerHTML = `
        <div class="status">
            Loading...
        </div>
    `;


    try{

        const data =
            await youtubeRequest({

                q:query,

                maxResults:"20"

            });


        const filtered =
            (data.items || [])
            .filter(function(item){

                return (
                    item?.id?.videoId &&
                    item.id.videoId !==
                    currentVideoId
                );

            });


        renderVideos(
            filtered,

    }
    catch(error){

        relatedResults.innerHTML = `
            <div class="status">
                Related videos unavailable.
            </div>
        `;

    }

}


/* =====================================================
   MORE VIDEOS
   40% RELATED
   60% RANDOM
===================================================== */

async function loadMoreVideos(){

    if(!hasApiKey()){
        return;
    }


    moreVideosResults.innerHTML = `
        <div class="more-loading">
            Loading more videos...
        </div>
    `;


    /*
       Current video-এর thumbnail
       More Videos button-এ দেখানো হবে
    */

    moreVideosPreview.src =
        currentVideoThumb || "";


    try{

        /*
           ১) Related search
        */

        const relatedQuery =
            normalizeSongTitle(
                currentVideoTitle
            ) ||
            "music";


        /*
           ২) Random category
        */

        const randomQueries = [

            "Bangla music",
            "Hindi songs",
            "English music",
            "sad songs",
            "romantic songs",
            "lofi music",
            "remix songs",
            "viral music",
            "new songs",
            "shorts music",
            "trending music",
            "Bangla shorts"

        ];


        const randomQuery =
            randomItem(
                randomQueries
            );


        /*
           দুইটা API request একসাথে
        */

        const [
            relatedData,
            randomData
        ] =
        await Promise.all([

            youtubeRequest({

                q:relatedQuery,

                maxResults:"10"

            }),

            youtubeRequest({

                q:randomQuery,

                maxResults:"20"

            })

        ]);


        /*
           Current video বাদ
        */

        const related =
            (relatedData.items || [])
            .filter(function(item){

                return (
                    item?.id?.videoId &&
                    item.id.videoId !==
                    currentVideoId
                );

            });


        const random =
            (randomData.items || [])
            .filter(function(item){

                return (
                    item?.id?.videoId &&
                    item.id.videoId !==
                    currentVideoId
                );

            });


        /*
           Related থেকে 8
           Random থেকে 12

           মোট 20
           ≈ 40% / 60%
        */

        const relatedPart =
            shuffle(
                related
            ).slice(0,8);


        const randomPart =
            shuffle(
                random
            ).slice(0,12);


        /*
           duplicate বাদ
        */

        const seen =
            new Set();

        let combined = [];


        for(
            const item of
            [...relatedPart,...randomPart]
        ){

            const id =
                item?.id?.videoId;


            if(
                id &&
                !seen.has(id) &&
                id !== currentVideoId
            ){

                seen.add(id);

                combined.push(item);

            }

        }


        /*
           আবার shuffle
           যাতে related সবসময়
           উপরে না থাকে
        */

        combined =
            shuffle(combined);


        moreVideosData =
            combined;


        renderMoreVideos(
            moreVideosData
        );


    }
    catch(error){

        console.error(error);

        moreVideosResults.innerHTML = `
            <div class="more-loading">
                Videos load করা যায়নি।
            </div>
        `;

    }

}

/* =====================================================
   RENDER MORE VIDEOS
===================================================== */

function renderMoreVideos(items){

    if(!items.length){

        moreVideosResults.innerHTML = `
            <div class="more-loading">
                কোনো ভিডিও পাওয়া যায়নি।

    ){

            makeMoreVideoCard(item);


        if(card){

            moreVideosResults.appendChild(
                card
            );

        }

    }

}


/* =====================================================
   MORE VIDEO FILTER
===================================================== */

function filterMoreVideos(filter){

    currentMoreFilter =
        filter;


    /*
       All = পুরো mixed list
    */

    if(filter === "all"){

        renderMoreVideos(
            shuffle(
                moreVideosData
            )
        );

        return;

    }


    /*
       Filter অনুযায়ী নতুন query
       করলে API খরচ বেশি হবে।
       তাই existing list থেকে
       random subset দেখানো হচ্ছে।
    */

    let list =
        [...moreVideosData];


    if(filter === "related"){

        list =
            list.slice(
                0,
                Math.min(
                    8,
                    list.length
                )
            );

    }
    else if(filter === "music"){

        list =
            shuffle(list)
            .slice(
                0,
                Math.min(
                    12,
                    list.length
                )
            );

    }
    else if(filter === "shorts"){

        list =
            shuffle(list)
            .slice(
                0,
                Math.min(
                    8,
                    list.length
                )
            );

    }
    else if(filter === "random"){

        list =
            shuffle(list);

    }


    renderMoreVideos(
        list
    );

}

   OPEN MORE VIDEOS

/* =====================================================
   FULLSCREEN + ORIENTATION
===================================================== */

async function enterVideoFullscreen(){

    try{

        /*
           Fullscreen
        */

        if(
            !document.fullscreenElement &&
            fullFrameHost.requestFullscreen
        ){

            await fullFrameHost.requestFullscreen();

        }
        else if(
            !document.fullscreenElement &&
            fullFrameHost.webkitRequestFullscreen
        ){

            fullFrameHost.webkitRequestFullscreen();

        }


        /*
           Landscape orientation lock
        */

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            try{

                await screen.orientation.lock(
                    "landscape"
                );

            }
            catch(error){

                console.log(
                    "Orientation lock not supported"
                );

            }

        }


        /*
           Fullscreen হলে More Videos button
           দেখা যাবে
        */

        setTimeout(
            function(){

                moreVideosButton.style.display =
                    "flex";

            },
            150
        );


    }
    catch(error){

        console.log(
            "Fullscreen unavailable",
            error
        );

    }

}


async function exitVideoFullscreen(){

    try{

        if(document.fullscreenElement){

            if(document.exitFullscreen){

                await document.exitFullscreen();

            }

        }
        else if(
            document.webkitFullscreenElement
        ){

            if(
                document.webkitExitFullscreen
            ){

                document.webkitExitFullscreen();

            }

        }

    }
    catch(error){}


    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }
    catch(error){}


    moreVideosButton.style.display =
        "none";

}


/* =====================================================
   ROTATE BUTTON
===================================================== */

).addEventListener(
    "click",
    function(){

        if(
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ){

            exitVideoFullscreen();

        }
        else{

            enterVideoFullscreen();

        }

    }
);


/* =====================================================
   FULLSCREEN CHANGE
===================================================== */

function fullscreenChanged(){

    const isFull =
        !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement
        );


    if(isFull){

        moreVideosButton.style.display =
            "flex";

    }
    else{

        moreVideosButton.style.display =
            "none";

        try{

            if(
                screen.orientation &&
                screen.orientation.unlock
            ){

                screen.orientation.unlock();

            }

        }
        catch(error){}

    }

}


document.addEventListener(
    "fullscreenchange",
    fullscreenChanged
);

document.addEventListener(
    "webkitfullscreenchange",
    fullscreenChanged
);

                    "backgroundMenu"

                    document.body.classList.add(

                    document.body.style.background =

                }
                else{

                    document.body.classList.remove(

                        document.body.style.background =
                            "#fff";

                    }

                }

            }
        );

    }
);


/* =====================================================
   WAKE LOCK
===================================================== */

async function requestWakeLock(){

    if(!("wakeLock" in navigator)){
        return;
    }


    try{

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

    }
    catch(error){

        console.log(
            "Wake Lock unavailable"
        );

    }

}


async function releaseWakeLock(){

    if(!wakeLock){
        return;
    }


    try{

        await wakeLock.release();

    }
    catch(error){}


    wakeLock = null;

}


document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible" &&
            playbackActive
        ){

            requestWakeLock();

        }

    }
);

===================================================== */

    function(event){

        if(event.touches.length > 1){

            event.preventDefault();

        }

    },
    {passive:false}
);


/* =====================================================
   DISABLE DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function(event){

        const now =
            Date.now();


        if(
            now - lastTouchEnd <= 300
        ){

            event.preventDefault();

        }


        lastTouchEnd = now;

    },
    {passive:false}
);
